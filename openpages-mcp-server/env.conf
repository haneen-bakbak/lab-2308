# ============================================================================
# LAB-2308: OpenPages MCP Server — Basic Auth Configuration
# Copy this file to ibm-openpages-mcp-server-develop/.env before starting.
#
# Environment: wxgov-govconsole-demo (TechZone)
# ============================================================================

# OpenPages Instance
OPENPAGES_BASE_URL=https://wxgov-govconsole-demo-2ho7021k.vsi.techzone.ibm.com/openpages

# Authentication — Basic (on-prem / hosted, no IAM required)
OPENPAGES_AUTHENTICATION_TYPE=basic
OPENPAGES_USERNAME=ask_lab_instructor
OPENPAGES_PASSWORD=ask_lab_instructor

# SSL — TechZone demo instances use self-signed certs; disable verification
SSL_VERIFY=false

# Server mode — remote HTTP so WxO can reach it over the network
SERVER_MODE=remote
HOST=0.0.0.0
PORT=8000

# General
APP_NAME=lab2308-grc-mcp-server
DEBUG=false
LOG_LEVEL=INFO
LOG_FORMAT=json

# Auth gate on the MCP server itself
# Set to false so WxO can connect without a token at the MCP level
AUTH_ENABLED=false

# Schema caching
SCHEMA_CACHE_MAX_SIZE=20
SCHEMA_CACHE_TTL=3600
ENABLE_MINIMAL_SCHEMA_MODE=true
CACHE_QUERY_EXAMPLES=true
