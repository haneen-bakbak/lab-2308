<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { rx: 6; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .code-badge { font-family: monospace; font-size: 11px; fill: #38bdf8; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead-blue); }
      .step-num { font-family: sans-serif; font-weight: bold; font-size: 12px; fill: #ffffff; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="920" height="480" class="bg"/>

  <text x="30" y="40" font-family="sans-serif" font-weight="800" font-size="20" fill="#f8fafc">Lab 2308 End-to-End Architecture &amp; Data Flow</text>
  <text x="30" y="65" font-family="sans-serif" font-size="13" fill="#94a3b8">How watsonx Orchestrate communicates securely with OpenPages GRC via MCP</text>

  <!-- Step 1: User / Bob -->
  <rect x="40" y="100" width="230" height="150" class="box" fill="#1e293b" stroke="#3b82f6"/>
  <circle cx="65" cy="125" r="12" fill="#3b82f6"/>
  <text x="65" y="129" class="step-num">1</text>
  <text x="85" y="130" class="title" fill="#60a5fa">IBM Bob (Orchestrator)</text>
  <text x="55" y="160" class="body">• Ingests Envmt Info</text>
  <text x="55" y="180" class="body">• Configures WxO connection</text>
  <text x="55" y="200" class="body">• Registers MCP toolkit</text>
  <text x="55" y="220" class="body">• Deploys <tspan class="code-badge">lab2308_risk_agent</tspan></text>

  <!-- Step 2: WxO Agent -->
  <rect x="345" y="100" width="240" height="150" class="box" fill="#1e293b" stroke="#8b5cf6"/>
  <circle cx="370" cy="125" r="12" fill="#8b5cf6"/>
  <text x="370" y="129" class="step-num">2</text>
  <text x="390" y="130" class="title" fill="#c084fc">watsonx Orchestrate</text>
  <text x="360" y="160" class="body">• Natural language reasoning</text>
  <text x="360" y="180" class="body">• Dynamic schema discovery</text>
  <text x="360" y="200" class="body">• Zero field hallucination</text>
  <text x="360" y="220" class="body">• Autonomous tool invocation</text>

  <!-- Step 3: MCP Server -->
  <rect x="655" y="100" width="225" height="150" class="box" fill="#1e293b" stroke="#06b6d4"/>
  <circle cx="680" cy="125" r="12" fill="#06b6d4"/>
  <text x="680" y="129" class="step-num">3</text>
  <text x="700" y="130" class="title" fill="#22d3ee">OpenPages MCP Server</text>
  <text x="670" y="160" class="body">• Protocol translation (MCP)</text>
  <text x="670" y="180" class="body">• Exposes 8 GRC tools</text>
  <text x="670" y="200" class="body">• Schema introspection</text>
  <text x="670" y="220" class="body">• Auth &amp; URL rewrites</text>

  <!-- Arrows 1 -> 2 -> 3 -->
  <path d="M 270 175 L 340 175" class="arrow-blue"/>
  <path d="M 585 175 L 650 175" class="arrow-blue"/>

  <!-- Step 4: OpenPages GRC Database -->
  <rect x="345" y="310" width="535" height="135" class="box" fill="#0f172a" stroke="#10b981"/>
  <circle cx="370" cy="335" r="12" fill="#10b981"/>
  <text x="370" y="339" class="step-num">4</text>
  <text x="390" y="340" class="title" fill="#34d399">IBM OpenPages GRC Core Platform (TechZone)</text>
  
  <rect x="365" y="365" width="115" height="60" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="375" y="388" font-family="sans-serif" font-weight="bold" font-size="12" fill="#f8fafc">SOXRisk</text>
  <text x="375" y="408" font-family="sans-serif" font-size="10" fill="#94a3b8">Risk Catalog</text>

  <rect x="495" y="365" width="115" height="60" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="505" y="388" font-family="sans-serif" font-weight="bold" font-size="12" fill="#f8fafc">SOXControl</text>
  <text x="505" y="408" font-family="sans-serif" font-size="10" fill="#94a3b8">Controls &amp; Tests</text>

  <rect x="625" y="365" width="115" height="60" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="635" y="388" font-family="sans-serif" font-weight="bold" font-size="12" fill="#f8fafc">SOXIssue</text>
  <text x="635" y="408" font-family="sans-serif" font-size="10" fill="#94a3b8">Findings &amp; Gaps</text>

  <rect x="755" y="365" width="110" height="60" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="765" y="388" font-family="sans-serif" font-weight="bold" font-size="12" fill="#f8fafc">Register</text>
  <text x="765" y="408" font-family="sans-serif" font-size="10" fill="#94a3b8">Entity Hierarchy</text>

  <!-- Arrow MCP to OpenPages -->
  <path d="M 770 250 L 770 305" class="arrow"/>
  <text x="780" y="280" font-family="monospace" font-size="11" fill="#64748b">REST API / OAuth</text>
</svg>