<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <style>
      .bg { fill: #161616; }
      .card { fill: #262626; stroke: #393939; stroke-width: 1; }
      .header-bar { fill: #161616; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 20px; fill: #f4f4f4; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #c6c6c6; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #f4f4f4; }
      .input-box { fill: #161616; stroke: #8d8d8d; stroke-width: 1; }
      .input-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 14px; fill: #ffffff; }
      .btn { fill: #0f62fe; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 14px; fill: #ffffff; text-anchor: middle; }
      .tag { fill: #393939; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8a3ffc; font-weight: 600; }
      .callout { fill: #1c2738; stroke: #4589ff; stroke-width: 1.5; rx: 4; }
      .callout-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #78a9ff; }
      .callout-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #d0e2ff; }
      .badge-step { fill: #0f62fe; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 12px; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" class="bg"/>

  <!-- Browser Header -->
  <rect width="900" height="40" class="header-bar"/>
  <circle cx="20" cy="20" r="6" fill="#da1e28"/>
  <circle cx="40" cy="20" r="6" fill="#f1c21b"/>
  <circle cx="60" cy="20" r="6" fill="#24a148"/>
  <rect x="100" y="8" width="600" height="24" rx="4" fill="#262626"/>
  <text x="115" y="24" font-family="monospace" font-size="12" fill="#8d8d8d">https://cloud.ibm.com/authorize/&lt;reservation-account-id&gt;</text>
  <rect x="720" y="8" width="160" height="24" rx="4" fill="#393939"/>
  <text x="735" y="24" font-family="sans-serif" font-size="11" fill="#f4f4f4">🔒 Private Window</text>

  <!-- Login Card Container -->
  <rect x="220" y="70" width="460" height="450" rx="2" class="card"/>

  <!-- IBM Cloud Header -->
  <text x="250" y="115" class="title">Log in to IBM Cloud</text>
  <text x="250" y="138" class="subtitle">TechZone Reservation Account Authentication</text>

  <!-- Step 1 Notice Callout -->
  <rect x="250" y="155" width="400" height="65" class="callout"/>
  <circle cx="270" cy="175" r="10" fill="#4589ff"/>
  <text x="270" y="179" class="badge-text">1</text>
  <text x="290" y="175" class="callout-title">App ID / TechZone Credentials</text>
  <text x="290" y="195" class="callout-body">Select "Log in with App ID" (Do NOT use personal IBM ID)</text>
  <text x="290" y="210" class="callout-body">Use the student account assigned to your reservation.</text>

  <!-- Email Field -->
  <text x="250" y="250" class="label">Username / Student ID</text>
  <rect x="250" y="260" width="400" height="40" class="input-box"/>
  <text x="265" y="285" class="input-text">student_&lt;reservation_id&gt;_1@techzone.ibm.com</text>

  <!-- Password Field -->
  <text x="250" y="325" class="label">Password</text>
  <rect x="250" y="335" width="400" height="40" class="input-box"/>
  <text x="265" y="360" class="input-text">•••••••••••••••</text>

  <!-- Action Button -->
  <rect x="250" y="395" width="400" height="45" class="btn"/>
  <text x="450" y="423" class="btn-text">Continue to watsonx Orchestrate →</text>

  <!-- Footer Tip -->
  <rect x="250" y="460" width="400" height="40" rx="2" fill="#202020" stroke="#333" stroke-width="1"/>
  <text x="265" y="484" font-family="sans-serif" font-size="11" fill="#8d8d8d">💡 Tip: Check your <tspan fill="#f4f4f4" font-weight="bold">Envmt Info</tspan> file for your student email &amp; password.</text>
</svg>