<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <style>
      .bg { fill: #161616; }
      .card { fill: #262626; stroke: #393939; stroke-width: 1; }
      .header-bar { fill: #161616; }
      .agent-header { fill: #262626; border-bottom: 1px solid #393939; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 16px; fill: #ffffff; }
      .badge-live { fill: #24a148; rx: 3; }
      .chat-bubble-user { fill: #0043ce; rx: 8; }
      .chat-bubble-agent { fill: #393939; rx: 8; }
      .msg-user { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #ffffff; }
      .msg-agent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #f4f4f4; }
      .reasoning-box { fill: #1e1e1e; stroke: #8a3ffc; stroke-width: 1; rx: 4; }
      .reasoning-title { font-family: monospace; font-size: 11px; fill: #be95ff; font-weight: bold; }
      .reasoning-code { font-family: monospace; font-size: 11px; fill: #d4bbff; }
      .table-box { fill: #161616; stroke: #525252; stroke-width: 1; }
      .prompt-box { fill: #262626; stroke: #0f62fe; stroke-width: 1.5; rx: 4; }
    </style>
  </defs>

  <rect width="900" height="560" class="bg"/>

  <!-- Top App Navigation -->
  <rect width="900" height="45" fill="#161616"/>
  <text x="20" y="28" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">IBM watsonx Orchestrate</text>
  <text x="240" y="28" font-family="sans-serif" font-size="13" fill="#8d8d8d">AI Agents  /  lab2308_risk_agent</text>
  <rect x="780" y="10" width="100" height="25" rx="3" fill="#393939"/>
  <text x="830" y="27" font-family="sans-serif" font-size="11" fill="#f4f4f4" text-anchor="middle">Agent Studio</text>

  <!-- Sidebar with agents -->
  <rect x="0" y="45" width="220" height="515" fill="#202020"/>
  <text x="18" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8d8d8d">YOUR AGENTS</text>
  
  <rect x="10" y="90" width="200" height="40" rx="3" fill="#393939"/>
  <circle cx="28" cy="110" r="6" fill="#24a148"/>
  <text x="42" y="114" font-family="sans-serif" font-weight="600" font-size="13" fill="#ffffff">lab2308_risk_agent</text>

  <rect x="10" y="138" width="200" height="35" rx="3" fill="transparent"/>
  <text x="42" y="160" font-family="sans-serif" font-size="12" fill="#8d8d8d">general_compliance_bot</text>

  <!-- Main Chat Container -->
  <rect x="230" y="55" width="655" height="490" rx="4" class="card"/>
  
  <!-- Chat Header -->
  <rect x="230" y="55" width="655" height="45" fill="#262626"/>
  <line x1="230" y1="100" x2="885" y2="100" stroke="#393939" stroke-width="1"/>
  <text x="250" y="83" class="title">Chat with lab2308_risk_agent</text>
  <rect x="460" y="70" width="55" height="20" class="badge-live"/>
  <text x="487" y="84" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">ACTIVE</text>
  <text x="730" y="83" font-family="sans-serif" font-size="12" fill="#78a9ff">Connected: OpenPages MCP</text>

  <!-- Message 1: User -->
  <rect x="420" y="115" width="445" height="45" class="chat-bubble-user"/>
  <text x="435" y="135" class="msg-user">Which of our risk categories have controls that are still</text>
  <text x="435" y="150" class="msg-user">awaiting assessment? Show me a breakdown.</text>

  <!-- Reasoning Trace Step -->
  <rect x="250" y="170" width="615" height="60" class="reasoning-box"/>
  <text x="265" y="188" class="reasoning-title">🔍 REASONING TRACE (Schema-First Query Pattern):</text>
  <text x="265" y="205" class="reasoning-code">1. Call: get_resource("openpages://schema/SOXControl") → Verified `OPSS-Ctl:Status`</text>
  <text x="265" y="220" class="reasoning-code">2. Call: execute_openpages_query("SELECT [OPSS-Ctl:Status] FROM [SOXControl]...")</text>

  <!-- Message 2: Agent Response -->
  <rect x="250" y="240" width="615" height="200" class="chat-bubble-agent"/>
  <text x="265" y="263" class="msg-agent" font-weight="bold">Analysis of Unassessed Controls across OpenPages Risk Register:</text>
  <text x="265" y="282" class="msg-agent">Found 45 controls across 4 primary risk categories awaiting assessment:</text>

  <!-- Table mockup inside agent bubble -->
  <rect x="265" y="295" width="585" height="100" class="table-box"/>
  <line x1="265" y1="320" x2="850" y2="320" stroke="#393939" stroke-width="1"/>
  <text x="280" y="312" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78a9ff">Risk Category</text>
  <text x="600" y="312" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78a9ff">Awaiting Assessment</text>
  <text x="760" y="312" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78a9ff">Exposure</text>

  <text x="280" y="338" font-family="sans-serif" font-size="11" fill="#f4f4f4">Clients, Products &amp; Business Practices</text>
  <text x="600" y="338" font-family="sans-serif" font-size="11" fill="#f4f4f4">18 controls (100%)</text>
  <text x="760" y="338" font-family="sans-serif" font-size="11" fill="#ff8389" font-weight="bold">HIGH ⚠️</text>

  <text x="280" y="360" font-family="sans-serif" font-size="11" fill="#f4f4f4">Execution, Delivery &amp; Process Management</text>
  <text x="600" y="360" font-family="sans-serif" font-size="11" fill="#f4f4f4">14 controls (100%)</text>
  <text x="760" y="360" font-family="sans-serif" font-size="11" fill="#ff8389" font-weight="bold">HIGH ⚠️</text>

  <text x="280" y="382" font-family="sans-serif" font-size="11" fill="#f4f4f4">Internal / External Fraud</text>
  <text x="600" y="382" font-family="sans-serif" font-size="11" fill="#f4f4f4">13 controls (100%)</text>
  <text x="760" y="382" font-family="sans-serif" font-size="11" fill="#f1c21b" font-weight="bold">MED ⚠️</text>

  <text x="265" y="423" class="msg-agent" fill="#78a9ff">Would you like me to log a new risk in OpenPages to address the Client Products exposure?</text>

  <!-- Prompt input bar -->
  <rect x="250" y="490" width="615" height="42" class="prompt-box"/>
  <text x="270" y="516" font-family="sans-serif" font-size="13" fill="#8d8d8d">Ask lab2308_risk_agent next prompt (e.g. Log a new risk for this gap...)</text>
  <rect x="815" y="496" width="40" height="30" rx="3" fill="#0f62fe"/>
  <text x="835" y="516" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">↑</text>
</svg>