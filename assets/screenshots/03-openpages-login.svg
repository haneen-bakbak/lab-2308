<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .header-bar { fill: #1e293b; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 6; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 22px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #e2e8f0; }
      .input-box { fill: #0f172a; stroke: #475569; stroke-width: 1; rx: 4; }
      .input-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 14px; fill: #38bdf8; }
      .btn { fill: #2563eb; rx: 4; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #ffffff; text-anchor: middle; }
      .warning-card { fill: #451a03; stroke: #b45309; stroke-width: 1.5; rx: 6; }
      .warn-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #fde047; }
      .warn-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #fef08a; }
      .tag-op { fill: #0369a1; rx: 3; }
      .tag-op-text { font-family: sans-serif; font-size: 11px; fill: #e0f2fe; font-weight: bold; }
    </style>
  </defs>

  <rect width="900" height="560" class="bg"/>

  <!-- Browser Header -->
  <rect width="900" height="40" class="header-bar"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="40" cy="20" r="6" fill="#eab308"/>
  <circle cx="60" cy="20" r="6" fill="#22c55e"/>
  <rect x="100" y="8" width="650" height="24" rx="4" fill="#0f172a"/>
  <text x="115" y="24" font-family="monospace" font-size="12" fill="#94a3b8">https://wxgov-govconsole-demo-&lt;res-id&gt;.vsi.techzone.ibm.com/openpages</text>

  <!-- Left Column: SSL Warning Explainer -->
  <rect x="60" y="75" width="360" height="445" class="warning-card"/>
  <circle cx="90" cy="105" r="14" fill="#d97706"/>
  <text x="90" y="110" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">⚠️</text>
  <text x="115" y="110" class="warn-title">Self-Signed Certificate Warning</text>
  
  <text x="80" y="145" class="warn-body">When opening your OpenPages instance for the first</text>
  <text x="80" y="165" class="warn-body">time, your browser will display a privacy warning:</text>

  <!-- Fake Browser Warning snippet -->
  <rect x="80" y="185" width="320" height="150" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="95" y="210" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ef4444">Your connection is not private</text>
  <text x="95" y="230" font-family="sans-serif" font-size="10" fill="#94a3b8">NET::ERR_CERT_AUTHORITY_INVALID</text>
  <text x="95" y="255" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. Click <tspan fill="#38bdf8" font-weight="bold">Advanced</tspan></text>
  <text x="95" y="275" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. Click <tspan fill="#38bdf8" font-weight="bold">Proceed to wxgov-govconsole... (unsafe)</tspan></text>
  <rect x="95" y="295" width="120" height="25" rx="3" fill="#334155"/>
  <text x="155" y="312" font-family="sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">Proceed →</text>

  <text x="80" y="365" class="warn-body">This is completely expected in TechZone sandbox</text>
  <text x="80" y="385" class="warn-body">environments. Once bypassed, you will reach the</text>
  <text x="80" y="405" class="warn-body">login interface on the right.</text>

  <!-- Right Column: OpenPages Login Card -->
  <rect x="460" y="75" width="380" height="445" class="card"/>
  
  <rect x="490" y="100" width="130" height="22" class="tag-op"/>
  <text x="500" y="115" class="tag-op-text">IBM OPENPAGES</text>
  
  <text x="490" y="150" class="title">Log in to OpenPages</text>
  <text x="490" y="172" class="subtitle">watsonx.governance GRC Platform</text>

  <!-- User field -->
  <text x="490" y="210" class="label">Username</text>
  <rect x="490" y="220" width="320" height="38" class="input-box"/>
  <text x="505" y="244" class="input-text">•••••••••••••••••••••</text>

  <!-- Password field -->
  <text x="490" y="285" class="label">Password</text>
  <rect x="490" y="295" width="320" height="38" class="input-box"/>
  <text x="505" y="319" class="input-text">••••••••</text>

  <!-- Login Button -->
  <rect x="490" y="360" width="320" height="42" class="btn"/>
  <text x="650" y="386" class="btn-text">Log In</text>

  <rect x="490" y="425" width="320" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="505" y="445" font-family="sans-serif" font-weight="bold" font-size="11" fill="#38bdf8">MCP Server Endpoint:</text>
  <text x="505" y="465" font-family="monospace" font-size="10" fill="#94a3b8">https://&lt;your-host&gt;/mcp</text>
  <text x="505" y="480" font-family="sans-serif" font-size="10" fill="#64748b">(Give this exact URL to Bob during setup)</text>
</svg>